org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.configuration-cache=true
android.dependency.useConstraints=true

# Blocked on upgrading KSP past 2.3.2 (and likely Kotlin past 2.2.10):
# KSP still registers generated sources via the legacy kotlin.sourceSets
# DSL, which AGP 9's built-in Kotlin rejects outright. See
# https://github.com/google/ksp/issues/2729. Revisit removing these once
# KSP ships native built-in-Kotlin support.
android.builtInKotlin=false
android.newDsl=false
